uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that FAISAL ABDUL MUTALLIB KHAN is an involved person under the
  Global Irregular Migration and Trafficking in Persons Sanctions Regulations 2025
  as he is or has been involved in facilitating a relevant activity, namely\n trafficking
  in persons. Specifically, he engaged in the recruitment of Indian nationals using
  deception for the purposes of exploitation. Using social media and other forms of
  communication, he advertised well paid jobs within the “Russian security sector”
  but, upon the recruits’ arrival in Russia, they were forced to fight against their
  will in Russia’s war of aggression in Ukraine. The recruits faced menaces including
  verbal abuse, threats and violence. \n"
