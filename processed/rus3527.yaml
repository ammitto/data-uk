uk_statement_of_reasons: |2

  The Secretary of State considers there are reasonable grounds to suspect Angelina Gennadyevna KUCHEROVA (hereafter KUCHEROVA) is an “involved person” under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following ground: KUCHEROVA is and has been involved in destabilising Ukraine by providing support for action which undermines or threatens the territorial integrity, sovereignty or independence of Ukraine by working as a social media commenter in the Social Design Agency (SDA).
