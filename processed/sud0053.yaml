uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Prodigious Real Estate Management Supervision Services (“PRODIGIOUS”) is an involved person under the Sudan (Sanctions) (EU Exit) Regulations 2020 through its association with the Rapid Support Forces, which is responsible for action, policy or activity which threatens the peace, stability and security of Sudan. PRODIGIOUS has, through its links to Abu Dharr Abdul Nabi Habiballa Ahmmed and his network of companies including Capital Tap Holding L.L.C, provided support for action, policy or activity which threatens the peace, stability and security of Sudan including by making available funds and economic resources that could contribute to such activity.
