  The Secretary of State considers that there are reasonable grounds to suspect that LIMITED LIABILITY COMPANY “TEKHNOPOL” is an “involved person” under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis that it is or has been involved in obtaining a benefit from or supporting the Government of Russia by carrying on business in a sector(s) of strategic significance to the Government of Russia, namely the Russian defence and electronics sectors.
