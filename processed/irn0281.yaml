uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Islamic Movement of Companions of the Right (“IMCR”) is
  an involved person under The Iran (Sanctions) Regulations 2023 on the basis of the
  following grounds: (1) IMCR is or has been involved in hostile activity by the Government
  of Iran, namely activity which undermines the security of the United Kingdom or
  any other country, and; (2) IMCR is or has been involved in hostile activity by
  the Government of Iran, namely attacks against persons and assets in the United
  Kingdom or any other country including the sabotage of assets. \n"
