uk_statement_of_reasons: "\nThe Secretary of State has reasonable grounds to suspect
  that Siddiq Ali Wad AL-BASHA is an involved person under the Sudan (Sanctions) (EU
  Exit) Regulations 2020 since he is or has been involved in a relevant activity.
  As Commander of the Abdullah Jamaa Battalion, he is responsible for or has provided
  support for violations of international humanitarian law in Sudan, including the
  use of violence based on ethnicity, specifically against the Kanabi people, the
  deliberate targeting of civilians, and rape and other forms of sexual and gender-based
  violence during the “recapture” of Wad Madani in Gezira State.\n \n"
