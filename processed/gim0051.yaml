uk_statement_of_reasons: |2

  The Secretary of State has reasonable grounds to suspect that Polina Alexandrovna AZARNYKH is an involved person under the Global Irregular Migration and Trafficking in Persons Sanctions Regulations 2025 as she is or has been involved in a relevant activity, namely the instrumentalisation of migration for the purposes of destabilisation. Backed by the Government of Russia, AZARNYKH facilitates the travel of individuals from countries like Egypt, Iraq, the Ivory Coast, Nigeria, Morocco, Syria, and Yemen to Ukraine via Russia for the purpose of destabilising Ukraine as the individuals are deployed to fight for Russia in its war of aggression in Ukraine.
