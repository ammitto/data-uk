  The Secretary of State considers that there are reasonable grounds to suspect that Russian GRU 29155 Officer Dmitriy Aleksandrovich VORONOV is or has been involved in relevant cyber activity, by being responsible for, engaging in, providing support for, or promoting the commission, planning or preparation of relevant cyber activity. The activity that VORONOV is or has been involved in undermines, or is intended to undermine, the integrity, prosperity or security of the United Kingdom or a country other than the United Kingdom.
