uk_statement_of_reasons: |2

  The Secretary of State has reasonable grounds to suspect that PJSC Oil and Gas Company Slavneft is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 because it is, and has been, involved in obtaining a benefit from or supporting the Government of Russia, through carrying on business in a sector of strategic significance to the Government of Russia, namely, the Russian energy sector.
