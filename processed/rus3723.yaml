  The Secretary of State considers there are reasonable grounds to suspect that Viktor Valerievich CHUDAK (hereafter CHUDAK) is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the grounds that he is or has been involved in destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine. Namely for cooperating with Russian occupation authorities and facilitating the unlawful detention and mistreatment of civilians in Kamianka-Dniprovska, Zaporizhzhia region.
