uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that JSC INTERCONSUL is an “involved person” under the Russia
  (Sanctions) (EU Exit) Regulations 2019 on the basis of the following grounds:  \n
  \nJSC INTERCONSUL is or has been involved in obtaining a benefit from or supporting
  the Government of Russia by carrying on business in sectors of strategic significance
  to the Government of Russia. Namely, JSC INTERCONSUL has been conducting business
  in the Russian defence and information, communications and digital technologies
  sectors.  \nJSC INTERCONSUL is associated with LLC NEPTUNE CO LTD, an entity which
  has been operating as a GRU front company that has been procuring goods and technology
  to support the production and development needs of the Russian defence sector.\n"
