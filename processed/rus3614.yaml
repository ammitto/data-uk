uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Sergey MENDELEEV (hereafter “MENDELEEV”) is an involved
  person under the Russia (Sanctions) (EU Exit) Regulations 2019 because: \n(1) MENDELEEV
  is or has been involved in obtaining a benefit from or supporting the Government
  of Russia by carrying on business, namely EXVED and INDEPENDENT DECENTRALIZED FINANCE
  SMARTBANK AND ECOSYSTEM, in a sector of strategic significance to the Government
  of Russia, namely the Russian financial services sector\n(2) MENDELEEV is or has
  been involved in obtaining a benefit from or supporting the Government of Russia
  by working as a director (whether executive or non-executive) or other manager or
  equivalent of EXVED and INDEPENDENT DECENTRALIZED FINANCE SMARTBANK AND ECOSYSTEM,
  which carry on business in the Russian financial services sector, which is a sector
  of strategic significance to the Government of Russia\n(3) MENDELEEV is or has been
  involved in destabilising Ukraine or undermining or threatening the territorial
  integrity, sovereignty or independence of Ukraine by providing financial services,
  or making available funds, economic resources, goods or technology to a person who
  provides financial services, or makes available funds, economic resources, goods
  or technology that could contribute to destabilising Ukraine or undermining or threatening
  the territorial integrity, sovereignty or independence of Ukraine\n"
