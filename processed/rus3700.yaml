uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Denis Valeryevich VULF (hereafter VULF) is an “involved person” under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following ground: VULF is or has been involved in undermining or threatening the territorial integrity, sovereignty or independence of Ukraine by working as a director or equivalent of an entity, RYBAR LLC, which is or has been responsible for engaging in, providing support for, or promoting any policy or action which undermines or threatens the territorial integrity, sovereignty or independence of Ukraine.
