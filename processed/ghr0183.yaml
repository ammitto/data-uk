uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that BSquare Technology Co. Ltd. is an involved person within
  the meaning of the Global Human Rights Sanctions Regulations 2020 on the basis of
  the following grounds: (1) BSquare Technology Co. Ltd. is associated with a person
  who is or has been involved in human rights abuses, namely Prince Group; (2) BSquare
  Technology Co. Ltd. is or has been involved in providing financial services, or
  making available funds, economic resources, goods or technology, to a person who
  is or has been involved in human rights abuses, namely Prince Group. Prince Group
  is or has been involved in the operation of scam centres in Cambodia. The treatment
  of individuals in these scam centres amounts to a serious abuse of the right not
  to be subjected to cruel, inhumane, or degrading treatment or punishment, and of
  the right to be free from slavery, not to be held in servitude or required to perform
  forced or\n \ncompulsory labour.\n"
