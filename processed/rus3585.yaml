uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Grigory Alexandrovich GUROV (hereafter ‘GUROV’) is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the following grounds: (1) GUROV is or has been involved in
   destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine as a person who is responsible for, engages in, provides support for, or promotes policies or actions which destabilise Ukraine or undermine or threaten the territorial integrity, sovereignty or independence of Ukraine, and (2) GUROV is or has been involved in
   obtaining a benefit from or supporting the Government of Russia through his role as Head of the Federal Agency for Youth Affairs and his former role as Head of the Board of the All-Russian Public-State Movement of Children and Youth “Movement of the First”.
