uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Abulkhaev Nurlan Amantaevich (hereafter “ABULKHAEV”) is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 because he is or has been involved in destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine as a person who is responsible for, engages in, provides support for, or promotes policies or actions which destabilise Ukraine or undermine or threaten the territorial integrity, sovereignty or independence of Ukraine, namely the arbitrary detention, torture and ill-treatment of Ukrainian civilians in the temporarily occupied territories of Ukraine as part of Russia’s wider system of occupation and coercive control.
