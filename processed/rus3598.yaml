uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Iryna Viktorivna KRAVCHENKO is an “involved person” under
  the Russia (Sanctions) (EU Exit) Regulation 2019 because she is and has been responsible
  for and provides support for policies or actions which undermine or threaten the
  territorial integrity, sovereignty or independence of Ukraine, by engaging in and
  providing support for the Government of Russia’s programme for the forced deportation
  and re-education of Ukrainian children. \n \n"
