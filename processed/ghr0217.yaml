uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Abdulkarim Amir al-Din Hussein AL-HOUTHI (hereafter AL-HOUTHI)
  is an involved person under The Global Human Rights and International Humanitarian
  Law Sanctions Regulations 2026 on the basis that he is or has been responsible for,
  and has facilitated and provided support for, activity which amounts to a serious
  abuse of the right of individuals not to be subjected to torture or cruel, inhuman
  or degrading treatment or punishment. Specifically, as Minister of Interior of the
  Houthi de facto authorities in Sana’a since May 2019, AL-HOUTHI has been responsible
  for the police, security forces, Criminal Investigation Department, women’s security
  unit and detention facilities of the Ministry of Interior, in whose custody detainees
  held without charge or trial have been subjected to torture and other cruel, inhuman
  or degrading treatment, including electric shocks, beatings and sexual violence.
  \n"
