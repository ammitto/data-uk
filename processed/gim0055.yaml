uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that DREAM HOME TRAVELS AND TOURS LTD is an involved person under
  the Global Irregular Migration and Trafficking in Persons Sanctions Regulations
  2025 as it is or has been involved in a relevant activity, namely trafficking in
  persons. Specifically, DREAM HOME TRAVELS AND TOURS LTD engaged in the recruitment
  of Bangladeshi nationals using deception and then exploited them. It advertised
  well paid roles within the services sector in Russia but, upon the Bangladeshi nationals’
  arrival in Russia, they were forced to fight on the front line of Russia’s war of
  aggression against Ukraine under coercion. \n"
