uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Myat Thet Oo is an involved person under The Myanmar (Sanctions)
  Regulations 2021 on the basis of the following grounds: \nGround 1: \nMajor General
  U Myat Thet Oo has held numerous senior roles within the government of Myanmar including
  as Ambassador to Laos, and senior ranks within the military of Myanmar, most recently,
  as a Major General, and formerly as a Brigadier General.\nGround 2: Through his
  military roles in the military government of Myanmar Major General U Myet Thet Oo
  has enabled the military junta in Myanmar to engage in repression of the civilian
  population in Myanmar.\n"
