uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Ariab Mining Company Limited ("ARIAB”) is an involved person under the Sudan (Sanctions) (EU Exit) Regulations 2020 because it has provided financial services or made available funds or economic resources that could contribute to an action, policy or activity which threatens the peace, stability and security of Sudan.  Specifically, ARIAB, as a major state-owned multi-mineral mining company in Sudan, has provided the SAF with revenue from conflict gold and other minerals. The SAF is one of the main warring parties in Sudan.
