other_information: "Listed pursuant to paragraphs 7(c), 7(d) 7(e) and 7(h) of resolution
  2293 (2016), as reaffirmed by paragraph 2 of resolution 2688 (2023) and paragraph
  3 of resolution 2738 (2024) and resolution 2783 (2025): CHARLES SEMATAMA has and
  continues to engage in acts that undermine the peace, stability and security of
  the DRC. \nParagraph 7(c): CHARLES SEMATAMA is the  military commander, of the Twirwaneho
  which has opposed the demobilisation of children. The Twirwaneho is also a member
  of the Congo River Alliance which is a politico-military platform formed in alliance
  with M23, a Congolese militia which received support from outside the DRC and which
  impedes the disarmament, demobilization and reintegration processes. \nParagraph
  7(d): The Twirwaneho recruits or uses children in armed conflict in the DRC in violation
  of international law.  \nParagraph 7(e): The Twirwaneho is responsible for human
  rights abuses and/or violations of international humanitarian law, including targeted
  attacks against civilians and recruitment of children in armed conflict. As the
  military commander for Twirwaneho, SEMATAMA is responsible for planning, directing
  or committing these acts.\nParagraph 7(h): CHARLES SEMATAMA, by his involvement
  with the Twirwaneho and the Congo River Alliance, collaborates with M23 (a designated
  entity) and therefore acts on behalf of a designated entity and shares responsibility
  for crimes committed by M23 in the DRC (killings, recruitment of child soldiers,
  and sexual abuse), which constitute human rights abuses against civilians and/or
  violations of international humanitarian law. "
