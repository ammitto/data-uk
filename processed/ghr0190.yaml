uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Xinbi Company Limited (“Xinbi”) is an involved person within
  the meaning of the Global Human Rights Sanctions Regulations 2020 on the basis of
  the following grounds: (1) Xinbi is or has been involved in providing financial
  services or making available funds, economic resources, goods or technology, knowing
  or having reasonable cause to suspect that those financial services or funds will
  or may contribute to human rights abuses, and; (2) Xinbi is or has been involved
  in profiting financially or otherwise obtaining a benefit from human rights abuses.
  Xinbi has enabled and profited from the operation of scam centres in Southeast Asia.
  The treatment of individuals in these scam centres amounts to a serious abuse of
  the right not to be subjected to cruel, inhumane, or degrading treatment or punishment,
  and of the right to be free from slavery, not to be held in servitude or required to
  perform forced or compulsory labour.  \n"
