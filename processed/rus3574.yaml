uk_statement_of_reasons: |2

  The Secretary of State considers there are reasonable grounds to suspect that the INTERNET DEVELOPMENT INSTITUTE is an “involved person” under the Russia (Sanctions) (EU Exit) Regulations 2019 based on the following grounds: (1) it is and has been involved in obtaining a benefit from or supporting the Government of Russia as carrying on business as a Government of Russia-affiliated entity which is owned or controlled by the Government of Russia; and (2) it is and has been involved in destabilising Ukraine by promoting any policy or action which destabilises Ukraine or undermines or threatens its territorial integrity, sovereignty or independence.
