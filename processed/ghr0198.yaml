  The Secretary of State considers that there are reasonable grounds to suspect Ben-Zion GOPSTEIN (hereafter “GOPSTEIN”) is an involved person under the Global Human Rights Sanctions Regulations 2020 on the basis of the following ground: GOPSTEIN is and/or has been facilitating, inciting, promoting or providing support for activity which amounts to a serious abuse of the right of individuals not to be subjected to cruel, inhuman or degrading treatment or punishment.  Specifically, GOPSTEIN has facilitated, incited, promoted and provided support for violence against Palestinian individuals.
