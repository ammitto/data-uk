uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that AMI GVIRTZMAN ARCHITECTS 2021 LIMITED (hereafter “AMI GVIRTZMAN”)
  is an involved person under the Global Human Rights and International Humanitarian
  Law Sanctions Regulations 2026 on the basis of the following grounds: (1) AMI GVIRTZMAN
  is or has been involved in facilitating or providing support for activity which
  constitutes a serious violation of international humanitarian law; (2) AMI GVIRTZMAN
  is or has been involved in profiting from activity which constitutes a serious violation
  of international humanitarian law. Specifically, AMI GVIRTZMAN is an Israeli architectural
  and planning practice which designs housing, neighbourhoods and public infrastructure
  for Israeli settlements in the occupied West Bank, including at Carmel, Ma’ale Amos,
  Tekoa and Efrat. The establishment and expansion of Israeli settlements in the occupied
  West Bank constitutes the transfer by Israel of parts of its own civilian population
  into the territory it occupies, contrary to Article 49(6) of the Fourth Geneva Convention,
  and a serious violation of international humanitarian law.  \n"
