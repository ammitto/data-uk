uk_statement_of_reasons: "\nThe Secretary of State considers there are reasonable
  grounds to suspect that DAYANA ECHEMENDIA DIAZ is an involved person under the Global
  Irregular Migration and Trafficking in Persons Sanctions Regulations 2025 as she
  is or has been involved in a relevant activity, namely\n trafficking in persons.
  Specifically, she engaged in the recruitment of Cuban nationals using deception
  for the purposes of exploitation. Using social media and other forms of communication,
  she advertised well paid jobs within Russia but, upon the recruits’ arrival in Russia,
  they were forced to fight against their will in Russia’s war of aggression in Ukraine.
  The recruits faced menaces including verbal abuse, threats and imprisonment. \n"
