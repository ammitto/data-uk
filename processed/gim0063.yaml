uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that 24x7 RAS OVERSEAS FOUNDATION is or has been an involved
  person under the Global Irregular Migration and Trafficking in Persons Sanctions
  Regulations 2025 as it has been involved in a relevant activity, namely \ntrafficking
  in persons. \nSpecifically, 24x7 RAS OVERSEAS FOUNDATION engaged in the recruitment
  of Indian nationals using deception and then exploited them. In its public communications,
  it advertised well paid roles within “the Russian security sector” but, upon the
  Indian nationals’ arrival in Russia, they were forced to fight on the front line
  of Russia’s war of aggression against Ukraine under the menaces, namely verbal abuse,
  threats and physical violence.\n"
