uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that LI Thet (“LI”) is an involved person within the meaning
  of the Global Human Rights Sanctions Regulations 2020 on the basis of the following
  grounds: (1) LI is associated with persons who are or have been involved in human
  rights abuses, namely CHEN Zhi and the Prince Group; (2) LI has provided financial
  services, or made available funds, economic resources, goods or technology to a
  person who is or has been involved in human rights abuses, namely CHEN Zhi and the
  Prince Group. CHEN Zhi and the Prince Group are or have been involved in the operation
  of scam centres in Cambodia. The treatment of individuals in these scam centres
  amounts to a serious abuse of the right not to be subjected to cruel, inhumane,
  or degrading treatment or punishment, and of the right to be free from slavery,
  not to be held in servitude or required to perform forced or\n \ncompulsory labour.
  \n"
