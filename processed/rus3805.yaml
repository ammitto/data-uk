other_information: "Shipping sanctions: where shipping sanctions apply, a specified
  ship is prohibited from entering a port in the UK, may be given a movement or a
  port entry direction, can be detained, and will be refused permission to register
  on the UK Ship Register or have its existing registration terminated. \n\nTrade
  sanctions:  \n\nProvision of services relating to specified ships; Where a ship
  is specified for the purposes of all of the following trade prohibitions, a person
  must not directly or indirectly provide to that ship: technical assistance; crew
  services; operating services; chartering services; brokering services; financial
  services or funds. A person must also not directly or indirectly provide services
  relating to the acquisition, sale, transfer or supply of a specified ship.  \n\nProcurement
  of services relating to specified ships: A person must not directly or indirectly procure services
  relating to a specified ship. For the purposes of this regulation, services relating
  to a specified ship include, in particular, services involving the use of that specified
  ship.  \n\nProhibition on chartering or operating specified ships: A person must
  not charter a specified ship, if the person knows, or has reasonable cause to suspect,
  that the ship is a specified ship. A person must not operate a specified ship, if
  the person knows, or has reasonable cause to suspect, that the ship is a specified
  ship.  \n\nThe above trade prohibitions may be subject to Part 7 of the Russia (Sanctions)
  (EU Exit) (Amendment) Regulations 2026 (Exceptions and licences).  "
uk_statement_of_reasons: "\nThe Secretary of State has reasonable grounds to suspect
  that IMO 9630028 is likely to be involved in an activity whose object or effect
  is to destabilise Ukraine or undermine or threaten the territorial integrity, sovereignty
  or independence of Ukraine, namely that IMO 9630028 is likely to be involved in
  carrying liquefied natural gas that originated in Russia from a place in Russia
  to a third country.  \n"
