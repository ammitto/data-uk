uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Michel Guy France Awana ATEBA is an involved person under
  the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following
  grounds: \n \nHe is or has been \ninvolved in destabilising Ukraine or undermining
  or threatening the territorial integrity, sovereignty or independence of Ukraine
  by providing support for or promoting actions which destabilise Ukraine or undermine
  or threaten its territorial integrity or independence. As Director and Chief Executive
  Officer of Enangue Holding, an entity incorporated in France but headquartered in
  Cameroon, \nhe has been involved in the recruitment of foreign nationals, largely
  from Cameroon, to join the Alabuga Start Programme. The Alabuga Start Programme
  is a recruitment scheme based in Russia which avails itself of deceptive practices
  to hire individuals, often from economically insecure backgrounds, \nto work in
  Russia's Alabuga Special Economic Zone in the Republic of Tatarstan. These individuals
  assist in the production of military drones within the Alabuga Special Economic
  Zone which are then deployed as attack and reconnaissance vehicles in Ukraine. \nHe
  is or has been working as a director or equivalent of Enangue Holding, \nan entity
  incorporated in France but headquartered in Cameroon\n, which has been involved
  in the recruitment of foreign nationals, largely from Cameroon, on behalf of the
  Alabuga Start Programme. \nThe Alabuga Start Programme is a Russian recruitment
  scheme that hires individuals from outside Russia, usually from economically insecure
  backgrounds, using deceptive practices and puts them to work in Russia's Alabuga
  Special Economic Zone in the Republic of Tatarstan. These individuals assist in
  the production of military drones within the Alabuga Special Economic Zone which
  are then deployed as attack and reconnaissance vehicles in Ukraine.\n"
