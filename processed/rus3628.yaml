uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that LLC MAGNUS LINK is an “involved person” under the Russia
  (Sanctions) (EU Exit) Regulations 2019 on the basis of the following grounds:  \n
  \nLLC MAGNUS LINK is or has been involved in obtaining a benefit from or supporting
  the Government of Russia by carrying on business in sectors of strategic significance
  to the Government of Russia. Namely, LLC MAGNUS LINK has been conducting business
  in the Russian defence and electronics sectors. \nLLC MAGNUS LINK is owned by Stanislav
  Sergeevich POPOV. Stanislav Sergeevich POPOV is an involved person because he is,
  or has been, involved in obtaining a benefit from or supporting the Government of
  Russia by working as a director of LLC NEPTUNE CO LTD, an entity that is, or has
  been, involved in obtaining a benefit from or supporting the Government of Russia
  by operating in the Russian defence and electronics sectors. \n"
