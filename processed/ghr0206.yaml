uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that HEMDAT SHOMRON LTD is an involved person under the Global Human Rights and International Humanitarian Law Sanctions Regulations 2026 on the basis of the following grounds: (1) HEMDAT SHOMRON LTD is or has been involved in facilitating or providing support for activity which constitutes a serious violation of international humanitarian law; (2) HEMDAT SHOMRON LTD is or has been involved in profiting from activity which constitutes a serious violation of international humanitarian law. Specifically, HEMDAT SHOMRON LTD is a property developer and building contractor which initiates, plans, builds and markets housing in Israeli settlements in the occupied West Bank, including at Einav, Kfar Tapuach, Pedu’el, Ma’ale Efrayim, Mitzpe Yericho and Dolev. The establishment and expansion of Israeli settlements in the occupied West Bank constitutes a serious violation of international humanitarian law.
