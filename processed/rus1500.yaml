  Mikhail SINELIN (hereafter referred to as SINELIN) is the co-founder and 50% shareholder of Newsfront. Newsfront is a Russian news organisation known for publishing disinformation about the war against Ukraine, thus supporting and promoting actions which destabilise Ukraine. By virtue of his role as the co-founder and 50% shareholder of Newsfront, SINELIN is engaged in and/or supporting and/or promoting the company which, through its actions, is involved in destabilising Ukraine.
