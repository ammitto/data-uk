uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Paata Abuladze is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following ground: Paata ABULADZE is or has been involved in providing support or promoting any policy or action which destabilises Ukraine or undermines or threatens the territorial integrity, sovereignty or independence of Ukraine. In his capacity as a Georgian political and military observer, he joined a delegation of Georgian politicians who met with the head of the so-called Donetsk People’s Republic, and subsequently publicised the visit.
