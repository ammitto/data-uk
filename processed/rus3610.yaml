other_information: "Correspondent banking relationships and processing payments: Where
  this prohibition applies, UK credit or financial institutions are prohibited from
  establishing or continuing a correspondent banking relationship with a designated
  person, and from processing payments to, from or via a designated person. The measures
  will also apply to credit or financial institutions \"owned or controlled\" by the
  designated person (as set out in the regulations).\n\nInternet Services Sanctions:
  When an individual or entity is designated for the purposes of this measure, social
  media services, internet access services and application stores must take reasonable
  steps to prevent users in the UK from accessing content, sites or applications provided
  by designated individuals or entities. "
uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that SOOTY LIMITED is or has been involved in obtaining a benefit
  from or supporting the Government of Russia by providing financial services, or
  making available funds, economic resources, goods or technology, to a person, who
  is carrying on business in a sector of strategic significance to the Government
  of Russia. \nThe Secretary of State considers that there are reasonable grounds
  to suspect that SOOTY LIMITED is or has been involved in obtaining a benefit from
  or supporting the Government of Russia by carrying on business in a sector of strategic
  significance to the Government of Russia, namely the Russian financial services
  sector.  \n"
