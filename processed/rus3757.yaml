  The Secretary of State considers that there are reasonable grounds to suspect that Ulan Arymbaevich BUKABAEV, hereafter "BUKABAEV", is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following ground: BUKABAEV is working as a director, whether executive or non-executive, of OJSC PROCESSING KG, which is carrying on business of economic significance to the Government of Russia.
