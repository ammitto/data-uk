uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Vladyslav Nikolayevich GOLOVIN (hereafter “GOLOVIN”) is
  an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the
  following grounds: (1) GOLOVIN is or has been involved in \nobtaining a benefit
  from or supporting the Government of Russia through his role as Head of ‘Yunarmia’
  (2)\n GOLOVIN is or has been involved in destabilising Ukraine or undermining or
  threatening the territorial integrity, sovereignty or independence of Ukraine as
  a person who is responsible for, engages in, provides support for, or promotes policies
  or actions which destabilise Ukraine or undermine or threaten the territorial integrity,
  sovereignty or independence of Ukraine, through his role as the Head of ‘Yunarmia’.\n"
