other_information: "This vessel has been specified under Regulation 57F for all of
  the following purposes:\n \nShipping sanctions, namely:  Prohibition on chartering
  or operating specified ships (regulation 57ZA); Prohibition on port entry (regulation
  57A); Directions prohibiting port entry (regulation 57B); Movement of ships (regulation
  57C); Detention of ships (regulation 57D); Registration of ships (regulation 57E).\n
  \nWhere all listed shipping sanctions apply, a specified ship must not be chartered
  or operated, is prohibited from being provided with access to or having its master
  or pilot cause it to enter a port in the UK, may have its registration on the UK
  Ship Register terminated, and a master or pilot of a specified ship may be given
  a port barring direction, a detention direction, and a port entry direction or a
  movement direction. \n \nTrade sanctions, namely: Provision of services relating
  to specified ships (regulation 46AA); Procurement of services relating to specified
  ships (regulation 46AB).\n \nWhere all listed trade sanctions apply (including both
  the provision of services relating to specified ships and the procurement of services
  relating to specified ships), it is an offence to directly or indirectly provide
  technical assistance, crew services, operating services, chartering services, brokering
  services, financial services or funds in relation to a specified ship. It is an
  offence to directly or indirectly provide services relating to the acquisition,
  sale, transfer or supply of a specified ship. It is also an offence to directly
  or indirectly procure services relating to a specified ship, including, in particular,
  services involving the use of that specified ship."
uk_statement_of_reasons: |2

  The Secretary of State has reasonable grounds to suspect that IMO 9408542 ("LING HONG") is, has been or is likely to be involved in activity whose object or effect is to destabilise Ukraine or undermine or threaten the territorial integrity, sovereignty or independence of Ukraine or to obtain a benefit from or support the Government of Russia. Namely, 9408542 is involved in carrying oil or oil products that originated in Russia from Russia to a third country.
