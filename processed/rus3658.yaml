uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Maksim Yurevich MAMONTOV is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 because he is, or has been, a member of THE MAIN DIRECTORATE OF THE GENERAL STAFF OF THE ARMED FORCES OF THE RUSSIAN FEDERATION (“the GRU”). Specifically, Maksim Yurevich MAMONTOV is an officer of the GRU and has been involved in supporting GRU front company LLC NEPTUNE CO LTD’s activities procuring goods and technology to support the production and development needs of the Russian defence sector.
