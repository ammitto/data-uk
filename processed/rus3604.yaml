uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that: \n \nARVIX LIMITED LIABILITY COMPANY \nhas been involved
  in obtaining a benefit from or supporting the Government of Russia by providing
  financial services, or making available funds, economic resources, or technology,
  to an involved person, namely Garantex and Grinex.\nARVIX LIMITED LIABILITY COMPANY
  is or has been obtaining a benefit from or supporting the Government of Russia by
  carrying on business in a sector of strategic significance to the Government of
  Russia; namely, the Russian financial services sector.\n"
