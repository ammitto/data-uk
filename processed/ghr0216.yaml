uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Abdul Hakim Hashem Ali AL-KHAIWANI (hereafter AL-KHAIWANI)
  is an involved person under The Global Human Rights and International Humanitarian
  Law Sanctions Regulations 2026 on the basis that he is or has been responsible for,
  and has facilitated and provided support for, activity which amounts to a serious
  abuse of the right of individuals not to be subjected to torture or cruel, inhuman
  or degrading treatment or punishment. Specifically, as Director of the Houthi Security
  and Intelligence Service since September 2019, and previously as Houthi Deputy Minister
  of Interior from 2016, AL-KHAIWANI has been responsible for security forces and
  detention facilities in which detainees, including journalists, activists, humanitarian
  workers and United Nations personnel held without charge or trial, have been subjected
  to torture and other cruel, inhuman or degrading treatment, including electric shocks,
  beatings, the removal of fingernails, waterboarding, sexual violence and the denial
  of food and medical care, in some cases resulting in death. \n"
