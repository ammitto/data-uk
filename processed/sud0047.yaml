uk_statement_of_reasons: |2

  The Secretary of State has reasonable grounds to suspect that Abu Zaid Talha Al-Misbah is an involved person under the Sudan (Sanctions) (EU Exit) Regulations 2020 because he is or has been involved in a relevant activity, namely being responsible for and providing support for the commission of violations of international humanitarian law in Sudan through his role as Commander of the Al-Baraa bin Malik Battalions during the systematic campaign of violence against civilians in Gezira State, including against persons on the basis of their ethnicity or religious beliefs.
