uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect Meir Mordechai ETTINGER (hereafter “ETTINGER”) is an involved person under the Global Human Rights Sanctions Regulations 2020 on the basis of the following ground: ETTINGER is and/or has been facilitating, inciting, promoting or providing support for activity which amounts to a serious abuse of the right of individuals not to be subjected to cruel, inhuman or degrading treatment or punishment. Specifically, ETTINGER has facilitated, incited, promoted and provided support for violence against Palestinians in Israel and the Occupied Palestinian Territories.
