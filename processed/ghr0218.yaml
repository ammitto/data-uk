uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that MYO HTUT HLAING (hereafter “HLAING”) is an involved person under the Global Human Rights and International Humanitarian Law Sanctions Regulations 2026 on the basis of the following ground: HLAING is or has been responsible for engaging in an activity which amounts to a serious abuse of the right of individuals not to be subjected to cruel, inhuman or degrading treatment or punishment, specifically the treatment of prisoners detained in Chin State, Myanmar, and HLAING is or has been involved in activity which constitutes obstruction of the delivery of and access to humanitarian assistance in Chin State, Myanmar.
