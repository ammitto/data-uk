uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Stanislav Sergeyevich POPOV is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following grounds:
  Stanislav Sergeyevich POPOV is, or has been, a member of THE MAIN DIRECTORATE OF THE GENERAL STAFF OF THE ARMED FORCES OF THE RUSSIAN FEDERATION (“the GRU”). Specifically, Stanislav Sergeyevich POPOV is an officer of the GRU and has been involved in supporting GRU front company LLC NEPTUNE CO LTD’s activities procuring goods and technology to support the production and development needs of the Russian defence sector.
  Stanislav Sergeyevich POPOV is, or has been, obtaining a benefit from or supporting the Government of Russia by working as a director of an entity that is, or has been, involved in obtaining a benefit from or supporting the government of Russia by operating in the Russian defence and electronics sectors. Namely, Stanislav Sergeyevich POPOV is a director of LLC NEPTUNE CO LTD.
