uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Al-Qard Al-Hasan (AQAH) is an involved person within the meaning of the Counter-Terrorism (International Sanctions) (EU Exit) Regulations 2019 on the basis of the following grounds: (a) AQAH is a member of, or associated with Hizballah, an entity which is and/or has been involved in terrorist activity; (b) that AQAH is involved in providing financial services and making available funds for the purposes of terrorism, specifically to Hizballah.
