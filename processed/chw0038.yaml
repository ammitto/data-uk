uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Vladimir \nBorisovich Kondratyev (hereafter “Kondratyev”)
  is an involved person under the Chemical Weapons (Sanctions) (EU Exit) Regulations
  2019 on the basis of the following grounds: (1) Kondratyev is or has been responsible
  for, engaging in, providing support for, or promoting prohibited activity related
  to chemical weapons; (2) Kondratyev is associated with the State Research Institute
  of Organic Chemistry and Technology (GosNIIOKhT, and hereafter “GosNIIOKh”) which
  is or has been responsible for, engaging in, providing support for, or promoting
  prohibited activity related to chemical weapons. Kondratyev is the Director of GosNIIOKhT.\n
  \n"
