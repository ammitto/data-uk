uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that HAREY ZAHAV MANAGEMENT LTD (hereafter HAREY ZAHAV) is an involved person under the Global Human Rights and International Humanitarian Law Sanctions Regulations 2026 on the basis of the following grounds: (1) HAREY ZAHAV facilitates or provides support for activity which constitutes a serious violation of international humanitarian law; (2) HAREY ZAHAV profits financially or obtains other benefit from activity which constitutes a serious violation of international humanitarian law. Specifically, HAREY ZAHAV is an Israeli property developer which initiates, plans, builds and markets housing in Israeli settlements in the occupied West Bank and which markets that housing to purchasers in Israel and abroad. The establishment and expansion of Israeli settlements in the occupied West Bank constitutes a serious violation of international humanitarian law.
