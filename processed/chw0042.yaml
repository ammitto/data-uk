uk_statement_of_reasons: "\nTh\ne Secretary of State considers that there are reasonable
  grounds to suspect that \nIvan Sergeyevich Kravtsov (hereafter “Kravtsov”) is an
  involved person under the Chemical Weapons (Sanctions) (EU Exit) Regulations 2019
  on the basis of the following grounds: (1) Kravtsov is or has been responsible for,
  engaging in, providing support for, or promoting prohibited activity related to
  chemical weapons; (2) Kravtsov is associated with SC Signal which is or has been
  responsible for, engaging in, providing support for, or promoting prohibited activity
  related to chemical weapons. Kravtsov is Head of the 4th Scientific Research Department
  at SC Signal. \n \n"
