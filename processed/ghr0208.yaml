uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that S.A.G. (VELVEL) BUILDING & DEVELOPMENT LTD (hereafter “S.A.G.
  (VELVEL)”) is an involved person under the Global Human Rights and International
  Humanitarian Law Sanctions Regulations 2026 on the basis of the following grounds:
  (1) S.A.G. (VELVEL) is or has been involved in facilitating or providing support
  for activity which constitutes a serious violation of international humanitarian
  law; (2) S.A.G. (VELVEL) is or has been involved in profiting from activity which
  constitutes a serious violation of international humanitarian law. Specifically,
  S.A.G. (VELVEL) is an Israeli contractor and developer which builds and markets
  housing and public buildings in Israeli settlements in the occupied West Bank, including
  at Erfat, Shilo and Eli. The establishment and expansion of Israeli settlements
  in the occupied West Bank constitutes a serious violation of international humanitarian
  law.\n \n"
