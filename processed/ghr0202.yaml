  The Secretary of State considers Avichai SUISSA (hereafter “SUISSA”) is an involved person within the meaning of the Global Human Rights Sanctions Regulations 2020 on the basis of the following ground: SUISSA provides financial services, or makes available funds, economic resources, goods or technology, knowing or having reasonable cause to suspect that those financial services, funds, economic resources, goods or technology will or may contribute to cruel, inhuman or degrading treatment.
