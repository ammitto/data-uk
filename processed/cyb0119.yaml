uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Marat Shaigovich ZHURKIN is or has been involved in relevant
  cyber activity through his association with Lumma Stealer. As a Lumma Stealer operator,
  he has been responsible for, engaging in, providing support for, or promoting the
  commission, planning or preparation of relevant cyber activity; and has provided
  technical assistance that could contribute to relevant cyber activity.\nSuch activity
  that ZHURKIN is or has been involved in, directly or indirectly caused, or was intended
  to cause, economic loss to, or prejudice to the commercial interests of, those affected
  by the activity. \n"
