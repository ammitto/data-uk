uk_statement_of_reasons: "\nThe Secretary of State has reasonable grounds to suspect
  that Abbas Khater Bakhit (“BAKHIT”) \nis an involved person under the Sudan (Sanctions)
  (EU Exit) Regulations 2020\n based on the following grounds:\n \n \nBAKHIT is or
  has been involved in a relevant activity, namely he has been responsible for or
  engaged in serious human rights violations or abuses \nas Lieutenant Colonel of
  the Rapid Support Forces and Commander overseeing the Al-Mina Al-Bari Detention
  Centre. In particular, he directed or participated in the torture of detainees during
  the “take over” of El Fasher in October 2025.\n \n \nBAKHIT is associated with an
  involved person, Gedo Hamdan Ahmed (“Ahmed”). Ahmed is \nLieutenant General and
  Deputy Commander of the Rapid Support Forces who has engaged in actions or policies
  that threaten the peace, security, or stability of Darfur, including acts of violence
  and human rights abuses. \nAhmed was BAKHIT’s superior at the Al-Mina Al-Bari Detention
  Centre.\n \n"
