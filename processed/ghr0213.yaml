uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that TZAV 9 is an involved person under the Global Human Rights
  and International Humanitarian Law Sanctions Regulations 2026 on the basis of the
  following ground: TZAV 9 is or has been responsible for activity which constitutes
  obstruction of the delivery or distribution of, or access to, humanitarian assistance.
  Specifically, TZAV 9 is an Israeli activist movement whose stated mission has been
  to stop humanitarian aid entering the Gaza Strip, and which has organised and carried
  out blockades of crossings, ports and roads used by humanitarian aid convoys bound
  for Gaza. \n"
