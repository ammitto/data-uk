uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that TRACE ROAD LLC is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 because it is associated with A7 LLC, a Government of Russia-affiliated entity carrying on business in a sector of strategic significance to the Government of Russia (namely the Russian financial services sector), by reason of: (i) its operational integration into the A7 network through shared infrastructure and personnel; (ii) the documented role of its principals within the network; and (iii) the financial benefit it obtains in that capacity. The Secretary of State further considers that there are reasonable grounds to suspect that TRACE ROAD LLC makes available economic resources to A7 LLC and to other persons within the A7 network which are themselves carrying on business as Government of Russia-affiliated entities and in the Russian financial services sector.
