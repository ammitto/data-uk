uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Savsan Ashuraliyevna YUSUPOVA is an involved person under
  the Russia (Sanctions) (EU Exit) Regulations 2019\n on the basis that\n she \nis
  or has been involved in destabilising Ukraine or undermining or threatening the
  territorial integrity, sovereignty or independence of Ukraine by providing support
  for or promoting actions which destabilise Ukraine or undermine or threaten its
  territorial integrity, sovereignty or independence.\nSpecifically, \nSavsan Ashuraliyevna
  YUSUPOVA has been involved in the recruitment of foreign nationals on behalf of
  Alabuga Start Programme. The Alabuga Start Programme is a Russian recruitment scheme
  that hires individuals from outside Russia, usually from economically insecure backgrounds,
  using deceptive practices and puts them to work in Russia's Alabuga Special Economic
  Zone in the Republic of Tatarstan. These individuals assist in the production of
  military drones within the Alabuga Special Economic Zone which are then deployed
  as attack and reconnaissance vehicles in Ukraine.\n"
