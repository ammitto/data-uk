uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Giorgi Iremadze is an involved person under the Russia (Sanctions)
  (EU Exit) Regulations 2019 on the basis of the following ground: Giorgi Iremadze
  is or has been involved in providing support or promoting any policy or action which
  destabilises Ukraine or undermines or threatens the territorial integrity, sovereignty
  or independence of Ukraine. In his capacity as a Georgian politician and member
  of the political council of the political party Solidarity for Peace, he joined
  a delegation of Georgian politicians who met with the head of the so-called Donetsk
  People’s Republic, and subsequently publicised the visit. \n"
