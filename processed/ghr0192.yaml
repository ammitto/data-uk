uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that EYAL HARI YEHUDA COMPANY LTD is an involved person under
  the Global Human Rights Sanctions Regulations 2020 on the basis of the following
  ground: \n \n \nEYAL HARI YEHUDA COMPANY LTD facilitates, incites, promotes or provides
  support for such an activity which amounts to a serious abuse of the right of an
  individual not to be subjected to cruel, inhuman or degrading treatment or punishment.\n
  \ \nEYAL HARI YEHUDA COMPANY LTD\n is responsible for or engages in such an activity
  \nwhich amounts to a serious abuse of the right of an individual not to be subjected
  to cruel, inhuman or degrading treatment or punishment.\n  \nSpecifically, EYAL
  HARI YEHUDA COMPANY LTD facilitates, supports and is responsible for owners, staff,
  associates and family members who have used company resources while hired on construction
  and demolition jobs in the West Bank to destroy Palestinian land and property as
  well as physically attack, shoot and kill Palestinians which has led to the wider
  forced displacement of Palestinians. \n"
