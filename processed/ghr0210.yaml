uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that LEV HAHAR YAZAMUT LIMITED (hereafter “LEV HAHAR”) is an
  involved person under the Global Human Rights and International Humanitarian Law
  Sanctions Regulations 2026 on the basis of the following grounds: (1) LEV HAHAR
  is or has been involved in facilitating or providing support for activity which
  constitutes a serious violation of international humanitarian law; (2) LEV HAHAR
  is or has been involved in profiting from activity which constitutes a serious violation
  of international humanitarian law. Specifically, LEV HAHAR is an Israeli property
  developer which builds and markets housing in Israeli settlements in the occupied
  West Bank Itamar, Elon Moreh, Bruchin, Rechelim, and Neria. The establishment and
  expansion of Israeli settlements in the occupied West Bank constitutes a serious
  violation of international humanitarian law.\n \n"
