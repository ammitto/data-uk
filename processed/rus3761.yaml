uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Alexander Jan Hendrik TATTERSALL is an \"involved person\"
  under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis that he is
  associated with an entity that is, or has been, involved in destabilising Ukraine
  or undermining or threatening the territorial integrity, sovereignty or independence
  of Ukraine by making available economic resources, goods or technology that could
  contribute to destabilising Ukraine or undermining or threatening the territorial
  integrity, sovereignty or independence of Ukraine. Namely, Alexander Jan Hendrik
  TATTERSALL is associated with REDWING METAL ULUSLARARASI TICARET ANONIM SIRKETI
  (REDWING METAL). \n"
