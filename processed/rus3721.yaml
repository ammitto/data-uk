uk_statement_of_reasons: |2

  The Secretary of State considers there are reasonable grounds to suspect that Nikolay Ivanovich DEREZA (hereafter “DEREZA”) is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 because he is or has been involved in destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine as a person who is responsible for, engages in, provides support for, or promotes policies or actions which destabilise Ukraine or undermine or threaten the territorial integrity, sovereignty or independence of Ukraine, namely by serving as an officer in the occupation detention system in Tokmak, Zaporizhzhia region, and participating in the detention, forced labour and mistreatment of civilians held under Russian occupation.
