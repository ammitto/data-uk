other_information: 'Listed pursuant to paragraphs 7 (c), 7 (e) and 7(h) of resolution
  2293 (2016), as reaffirmed by paragraph 2 of resolution 2688 (2023) and paragraph
  3 of resolution 2738 (2024) and resolution 2783 (2025): CORNEILLE NANGAA YOBELUO
  has and continues to engage in acts that undermine the peace, stability and security
  of the DRC. He is the political leader of the Congo River Alliance (AFC), which
  is a politico-military platform formed in alliance with M23, a Congolese militia
  which received support from outside the DRC and which impedes the disarmament, demobilization
  and reintegration processes. As a leader of the alliance with M23, CORNEILLE NANGAA
  YOBELUO acts on behalf of a designated entity and shares responsibility for crimes
  committed by M23 in the DRC (killings, recruitment of child soldiers, and sexual
  abuse), which constitute human rights abuses against civilians.'
