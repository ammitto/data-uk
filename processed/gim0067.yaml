uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that O.S.D BROS TRAVELS & VISA SERVICES PRIVATE LIMITED is or
  has been an involved person under the Global Irregular Migration and Trafficking
  in Persons Sanctions Regulations 2025 as it has been involved in a relevant activity,
  namely \ntrafficking in persons. \nSpecifically, O.S.D BROS TRAVELS & VISA SERVICES
  PRIVATE LIMITED engaged in the recruitment of Indian nationals using deception and
  then exploited them. In its public communications, it advertised the provision of
  student visas to Russia but, upon the Indian nationals’ arrival in Russia, their
  passports were seized they were forced to fight on the front line of Russia’s war
  of aggression against Ukraine against their will.\n"
