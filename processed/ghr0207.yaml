uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Z.F. BUILDING COMPANY LTD (hereafter “Z.F. BUILDING”) is an involved person under the Global Human Rights and International Humanitarian Law Sanctions Regulations 2026 on the basis of the following grounds: (1) Z.F. BUILDING is or has been involved in facilitating or providing support for activity which constitutes a serious violation of international humanitarian law; (2) Z.F. BUILDING  is or has been involved in profiting from activity which constitutes a serious violation of international humanitarian law. Specifically, Z.F. BUILDING is an Israeli property developer which initiates, plans, builds and markets housing in Israeli settlements in the occupied West Bank, including at Ma'ale Yisrael, Nokdim and Kiryat Netafim. The establishment and expansion of Israeli settlements in the occupied West Bank constitutes the transfer by Israel of parts of its own civilian population into the territory it occupies, contrary to Article 49(6) of the Fourth Geneva Convention, and a serious violation of international humanitarian law.
