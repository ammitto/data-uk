uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Mohammad Sufiyan Dawood Ahmad DARAGUR is an involved person
  under the Global Irregular Migration and Trafficking in Persons Sanctions Regulations
  2025 as he is associated with a relevant person. Specifically, he is a director
  of Baba Vlogs Overseas Recruitment Solutions Private Limited, a company which is
  and has been involved in a relevant activity, namely human trafficking. The entity
  recruited Indian nationals using coercive means for purposes of exploitation, namely
  deployment on the front line of Russia’s war in Ukraine. \n"
