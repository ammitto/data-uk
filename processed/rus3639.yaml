uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Alexander Petrovich VORONKOV is an “involved person” under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis that he is or has been involved in obtaining a benefit from or supporting the Government of Russia by owning an entity carrying on business in sectors of strategic significance to the Government of Russia, namely the electronics and defence sectors. Specifically, Alexander Petrovich VORONKOV is the owner of LLC TEKHNOPOL.
