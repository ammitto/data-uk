uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect Nadia Narimanovna Cherkasova is an “involved person” under the
  Russia (Sanctions) (EU Exit) Regulations 2019 because she has been involved in obtaining
  a benefit from or supporting the Government of Russia by (1) working as a director,
  manager or equivalent of an entity which has been carrying on business in a sector
  of strategic significance to the Government of Russia, namely Bank Otkritie Financial
  Corporation PJSC, which was carrying on business in the Russian financial services
  sector; (2) working as a director, manager or equivalent of a Government of Russia-affiliated
  entity, namely Bank Otkritie Financial Corporation PJSC. \n"
