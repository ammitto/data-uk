uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Timofey Vladimirovich VASILIEV is an “involved person” under
  the Russia (Sanctions) (EU Exit) Regulations 2019 as he is and has been involved
  in destabilising Ukraine or undermining or threatening the territorial integrity,
  sovereignty or independence of Ukraine by working as a director or equivalent of
  ANO Dialog which promotes any policy or action which destabilises Ukraine or undermines
  or threatens its territorial integrity, sovereignty or independence. \n"
