other_information: 'Transport sanctions: Where transport sanctions apply, a ship owned,
  controlled, chartered or operated by a designated person is prohibited from entering
  a port in the UK, may be given a movement or a port entry direction, can be detained,
  and will be refused permission to register on the UK Ship Register or have its existing
  registration terminated. Similarly, an aircraft owned, chartered or operated by
  a designated person is prohibited from overflying or landing in the UK, may be given
  a movement direction, can be detained or moved to a specified airport, and will
  be refused permission to register on the CAA Aircraft Register or have its existing
  registration terminated. In addition, the prohibition on the provision of technical
  assistance relating to aircraft and ships will prevent a person from directly or
  indirectly providing technical assistance to, or for the benefit of, the designated
  person, where that technical assistance relates to an aircraft or a ship.'
uk_statement_of_reasons: "\nThe Secretary of State has reasonable grounds to suspect
  that NOVUS ENERGY DMCC is an involved person under the Russia (EU Exit) (Sanctions)
  Regulations 2019 on the basis of the following ground: NOVUS ENERGY DMCC is or has
  been involved in obtaining a benefit from or supporting the Government of Russia
  by carrying on business in a sector of strategic significance to the Government
  of Russia, namely the Russian energy sector, including by dealing with UK-specified
  ships. \n"
