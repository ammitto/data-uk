other_information: |-
  Internet Services Sanctions: When an individual or entity is designated for the purposes of this measure, social media services, internet access services and application stores must take reasonable steps to prevent users in the UK from accessing content, sites or applications provided by designated individuals or entities.

  Correspondent banking relationships and processing payments: Where this prohibition applies, UK credit or financial institutions are prohibited from establishing or continuing a correspondent banking relationship with a designated person, and from processing payments to, from or via a designated person. The measures will also apply to credit or financial institutions "owned or controlled" by the designated person (as set out in the regulations).
