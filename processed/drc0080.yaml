other_information: 'Listed pursuant to paragraphs 7(e) and 7(h) of resolution 2293
  (2016), as reaffirmed by paragraph 2 of resolution 2688 (2023) and paragraph 3 of
  resolution 2738 (2024) and resolution 2783 (2025): KUBWAYO has and continues to
  engage in acts that undermine the peace, stability and security of the DRC. He is
  a key leader of the UN sanctioned Forces Democratiques De Liberation Du Rwanda (FDLR),
  an extremist armed group that commits atrocities which undermines the peace, stability
  and security of the RDC. As a leader of FDLR, KUBWAYO acts on behalf of a designated
  entity and shares responsibility for crimes allegedly committed by the FDLR in the
  DRC (killings, recruitment of child soldiers, and sexual abuse), which constitute
  human rights abuses against civilians.'
