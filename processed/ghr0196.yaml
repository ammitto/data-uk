uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Shivat Zion\n Lerigvey Admata is an involved person within
  the meaning of the Global Human Rights Sanctions Regulations 2020 on the basis of
  the following grounds: \n \n \n  (1) Shivat Zion Lerigvey Admata provides financial
  services, or makes available funds, economic resources, goods or technology, knowing
  or having reasonable cause to suspect that those financial services, funds, economic
  resources, goods or technology will or may contribute to activity which amounts
  to a serious abuse of the right of an individual not to be subjected to cruel, inhuman
  or degrading treatment or punishment [reg 6(3)(d)];\n \n \n(2) Shivat Zion Lerigvey
  Admata provides financial services, or makes available funds, economic resources,
  goods or technology to persons responsible for or who engage in activity which amounts
  to a serious abuse of the right of an individual not to be subjected to cruel, inhuman
  or degrading treatment or punishment [reg 6(3)(e)];\n \n \n Specifically, Shivat
  Zion Lerigvey Admata is the registered legal vehicle through which ARTZENU's financial
  activities are conducted, channelling donations to settler farms and outposts in
  the West Bank, including outposts associated with acts of violence, intimidation
  and the forced displacement of Palestinians. Recipients of funding include outposts
  and individuals designated by the UK for involvement in serious abuses of the human
  rights of Palestinians. \n"
