uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that SARIM AL-DIN MUFADDAL (hereafter “MUFADDAL”) is an involved
  person under the Global Human Rights and International Humanitarian Law Sanctions
  Regulations 2026 on the basis that he is or has been responsible for or engaged
  in activity which amounts to a serious abuse of the right of individuals not to
  be subjected to torture or cruel, inhuman or degrading treatment or punishment.
  Specifically, as a prosecutor of the Specialised Criminal Prosecution in Sana’a
  under the Houthi de facto authorities, MUFADDAL is reasonably suspected of having
  directly perpetrated, or knowingly permitted or acquiesced in, sexual violence including
  rape, torture and other cruel, inhuman or degrading treatment of women detainees.
  \n"
