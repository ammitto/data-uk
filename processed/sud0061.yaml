uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Omdurman Mining is an involved person under the Sudan (Sanctions) (EU Exit) Regulations 2020 because it has made available funds or economic resources that could contribute to action, policy or activity which threatens the peace, stability and security of Sudan, in that, as a gold mining company operating in territory controlled by the Sudanese Armed Forces (SAF) and part-owned by the state-owned Sudamin Company Limited, it has provided the SAF with revenue from gold. The SAF is one of the main parties to the conflict in Sudan.
