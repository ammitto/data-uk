other_information: 'Listed pursuant to paragraphs 7(a), 7 (e), 7(h) and 7(j) of resolution
  2293 (2016), as reaffirmed by paragraph 2 of resolution 2688 (2023) and paragraph
  3 of resolution 2738 (2024) and resolution 2783 (2025): MUHAMMED LUMISA has and
  continues to engage in acts that undermine the peace, stability and security of
  the DRC. He is a Senior Commander of the Allied Democratic Forces (ADF), which is
  an extremist armed rebel group that commits atrocities which undermine the peace,
  stability and security of the DRC. As leader of the ADF, LUMSISA engages in violation
  of the measures taken by Member States in accordance with the arms embargo.  As
  a leader of the ADF, LUMISA acts on behalf of a designated entity and shares responsibility
  for crimes committed by the ADF in the DRC (killings, recruitment of child soldiers,
  and sexual abuse), which constitute human rights abuses against civilians. As a
  leader of the ADF, LUMISA continues to engage in or provide financial, material,
  or technological support for, or goods or services to, or in support of a designated
  entity.'
