uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that Sergey Aleksandrovich TOLMACHEV is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following ground: Sergey Aleksandrovich TOLMACHEV is or has been involved in destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine by working for the Government of Russia as a regional “Deputy Governor” of Sevastopol, installed by Russia in the temporarily occupied territory of the City of Sevastopol and as a regional “Deputy Governor” of Zaporizhzhia, installed in the temporarily occupied region of Zaporizhzhia.
