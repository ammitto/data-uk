uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Marat Arkadyevich KAMBOLOV is an involved person under the
  Russia (Sanctions) (EU Exit) Regulations 2019 on the basis of the following grounds:\n1.
  KAMBOLOV has obtained a benefit from the Government of Russia by working as a director
  (whether executive or non-executive), trustee, or other manager or equivalent, of
  the Kurchatov Institute between 2015 and 2025, which is carrying on business in
  the Russian Energy Sector. \n2. KAMBOLOV has obtained a benefit from the Government
  of Russia by working as a director (whether executive or non-executive), trustee,
  or other manager or equivalent of the Kurchatov Institute between 2015 and 2025,
  which is Government of Russia-affiliated entity.\n"
