uk_statement_of_reasons: |2

  The Secretary of State considers that there are reasonable grounds to suspect that ALBION LLC is an “involved person” under the Russia (Sanctions) (EU Exit) Regulations 2019 because it is, or has been, involved in destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine by making available goods or technology that could contribute to destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine. Namely, by importing into Russia epoxy resin (a material used in producing carbon fibre for various weapons components); and electrical goods on the UK Common High-Priority Items List.
