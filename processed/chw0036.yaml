uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that \nthe State Research Institute of Military Medicine (hereafter
  “GNIII VM”) is an involved person under the Chemical Weapons (Sanctions) (EU Exit)
  Regulations 2019 on the basis of the following grounds: (1) GNIII VM is or has been
  responsible for, engaging in, providing support for, or promoting prohibited activity
  related to chemical weapons; (2) GNIII VM is a member of, or associated with, \nentities\n,
  namely SC Signal and the State Research Institute of Organic Chemistry and Technology
  (GosNIIOKhT), which are or have been responsible for, engaging in, providing support
  for, or promoting prohibited activity related to chemical weapons.\n \n"
