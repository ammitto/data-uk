uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that LLC NEPTUNE CO LTD is an involved person under the Russia
  (Sanctions) (EU Exit) Regulations 2019 on the basis of the following grounds: \nLLC
  NEPTUNE CO LTD is associated with THE MAIN DIRECTORATE OF THE GENERAL STAFF OF THE
  ARMED FORCES OF THE RUSSIAN FEDERATION (GRU). LLC NEPTUNE CO LTD is a GRU front
  company that has been procuring goods and technology to support the production and
  development needs of the Russian defence sector. \nLLC NEPTUNE CO LTD is or has
  been involved in obtaining a benefit from or supporting the Government of Russia
  by carrying on business in sectors of strategic significance to the Government of
  Russia. Namely, LLC NEPTUNE CO LTD has been conducting business in the Russian defence
  and electronics sectors. \n"
