uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that Rakesh Taraknath PANDEY is an involved person under the
  Regulations as he is or has been involved in facilitating a relevant activity, namely\n
  trafficking in persons. Specifically, he engaged in the recruitment of Indian nationals
  using deception for the purposes of exploitation. Using social media and other forms
  of communication, he advertised the provision of student visas in Russia but, upon
  the recruits’ arrival in Russia, they were forced to fight on the front line of
  Russia’s war of aggression in Ukraine against their will. \n"
