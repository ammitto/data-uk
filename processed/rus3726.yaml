  The Secretary of State considers there are reasonable grounds to suspect that Viktor Leonidovich BEDRIK (hereafter BEDRIK) is an involved person under the Russia (Sanctions) (EU Exit) Regulations 2019 on the grounds that BEDRIK is or has been involved in destabilising Ukraine or undermining or threatening the territorial integrity, sovereignty or independence of Ukraine as a person who is responsible for, engages in, provides support for, or promotes policies or actions which destabilise Ukraine or undermine or threaten the territorial integrity, sovereignty or independence of Ukraine, n
  amely serving as military commandant of occupied Kherson region and directing, facilitating and participating in the unlawful detention, torture and mistreatment of civilians through the Russian occupation military commandant’s office in Kherson.
