other_information: |-
  Correspondent Banking Sanctions and processing payments:  Where this prohibition applies, UK credit or financial institutions are prohibited from establishing or continuing a correspondent banking relationship with a designated person, and from processing payments to, from or via a designated person. The measures will also apply to credit or financial institutions "owned or controlled" by the designated person (as set out in the regulations).

  Internet Services Sanctions: When an individual or entity is designated for the purposes of this measure, social media services, internet access services and application stores must take reasonable steps to prevent users in the UK from accessing content, sites or applications provided by designated individuals or entities.
uk_statement_of_reasons: "\nThe Secretary of State considers that there are reasonable
  grounds to suspect that: \n \nNUEVA CRYPTOLOGIA., SOCIEDAD POR ACCIONES SIMPLIFICADA
  DE CAPITAL VARIABLE (S.A.S. DE C.V)\n has been involved in obtaining a benefit from
  or supporting the Government of Russia by providing financial services, or making
  available funds, economic resources, or technology, to an involved person, namely
  Garantex and Grinex.\nNUEVA CRYPTOLOGIA, SOCIEDAD POR ACCIONES SIMPLIFICADA DE CAPITAL
  VARIABLE (S.A.S. DE C.V.) is or has been obtaining a benefit from or supporting
  the Government of Russia by carrying on business in a sector of strategic significance
  to the Government of Russia; namely, the Russian financial services sector.\n"
