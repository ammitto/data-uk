  for the commission of violations of international humanitarian law in Sudan, including
  violence against persons on the basis of their ethnicity and the deliberate targeting
  of civilians. As a Major General in the Rapid Support Forces, he played a commanding
  role issuing direct orders during the “takeover” of El Fasher in October 2025. He
  has since defected to the Sudanese Armed Forces.\n \n"
