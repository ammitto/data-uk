  The Secretary of State considers that there are reasonable grounds to suspect that Portex Trade Limited is an involved person under the Sudan (Sanctions) (EU Exit) Regulations 2020 because it is associated with Defense Industries System (DIS) (an involved person), supports activity which the Sudanese Armed Forces (SAF) is involved in, is involved in the supply to Sudan  (specifically the SAF) of military goods or military technology or material related to such goods or technology, and thereby engages in activity whichthreatens the peace, stability and security of Sudan.
