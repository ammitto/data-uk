uk_statement_of_reasons: "\nThe Secretary of State considers there are reasonable
  grounds to suspect that the Centre for the Study of the Youth Environment and Monitoring
  of Networks (hereafter “CISM”) is an “\ninvolved \nperson” under the Russia (Sanctions)
  (EU Exit) Regulations 2019 on the basis of the following grounds: 1) CISM is and
  has been involved in destabilising Ukraine by being responsible for, engaging in,
  providing support for, or promoting any policy or action which destabilises Ukraine
  or undermines or threatens the territorial integrity, sovereignty or independence
  of Ukraine; and 2) CISM is and has been involved in obtaining a benefit from or
  supporting the Government of Russia by carrying on business as a Government of Russia-affiliated
  entity by being owned or controlled directly or indirectly by the Government of
  Russia. \n"
